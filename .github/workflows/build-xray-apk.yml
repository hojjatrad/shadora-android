name: Build SHADORA Multi-Core APK (All 14 Protocols + Mieru & Cloak NDK)

on:
  workflow_dispatch:
    inputs:
      include_libv2ray:
        description: "Also bundle optional AndroidLibXrayLite (libv2ray.aar) alongside sing-box"
        required: false
        default: "false"
        type: boolean
      mieru_version:
        description: "Mieru git tag to cross-compile (e.g. v3.12.0 or 'latest')"
        required: false
        default: "latest"
      cloak_version:
        description: "Cloak git tag to cross-compile (e.g. v2.10.0 or 'latest')"
        required: false
        default: "latest"
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SHADORA repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go 1.23 (for Mieru & Cloak cross-compilation)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Cross-compile Mieru (libmieru.so) for Android ABIs
        env:
          REQ_TAG: ${{ github.event.inputs.mieru_version || 'latest' }}
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          if [ "$REQ_TAG" = "latest" ]; then
            git clone --depth 1 https://github.com/enfein/mieru.git "$WORKDIR/mieru"
          else
            git clone --depth 1 --branch "$REQ_TAG" https://github.com/enfein/mieru.git "$WORKDIR/mieru"
          fi
          cd "$WORKDIR/mieru"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
                   "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" \
                   "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmieru.so" ./cmd/mieru
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libmieru.so" ./cmd/mieru
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libmieru.so" ./cmd/mieru

      - name: Cross-compile Cloak ck-client (libckclient.so) for Android ABIs
        env:
          REQ_TAG: ${{ github.event.inputs.cloak_version || 'latest' }}
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          if [ "$REQ_TAG" = "latest" ]; then
            git clone --depth 1 https://github.com/cbeuw/Cloak.git "$WORKDIR/cloak"
          else
            git clone --depth 1 --branch "$REQ_TAG" https://github.com/cbeuw/Cloak.git "$WORKDIR/cloak"
          fi
          cd "$WORKDIR/cloak"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
                   "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" \
                   "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libckclient.so" ./cmd/ck-client
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libckclient.so" ./cmd/ck-client
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libckclient.so" ./cmd/ck-client

      - name: Download optional libv2ray.aar (if enabled)
        if: ${{ github.event.inputs.include_libv2ray == true }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          AAR_URL=$(curl -fsSL "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data.get('assets', []):
              if a.get('name') == 'libv2ray.aar':
                  print(a['browser_download_url'])
                  break
          ")
          if [ -n "$AAR_URL" ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar "$AAR_URL"
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Shadora Debug,O=Shadora,C=US"
          fi

      - name: Build Full Multi-Core SHADORA APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload SHADORA Multi-Core APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadora-vpn-multicore-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
